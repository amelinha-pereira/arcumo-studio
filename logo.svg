<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A020;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#E8A020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0C060;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (transparent for flexibility) -->

  <!-- Arc Icon Mark -->
  <!-- Outer arc -->
  <path d="M 20 90 A 52 52 0 0 1 96 38" stroke="url(#arcGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>
  <!-- Inner arc -->
  <path d="M 28 90 A 40 40 0 0 1 90 46" stroke="url(#arcGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Core arc - brightest -->
  <path d="M 36 90 A 28 28 0 0 1 84 54" stroke="#E8A020" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Dot at arc end -->
  <circle cx="84" cy="54" r="3.5" fill="#E8A020" filter="url(#glow)"/>
  <circle cx="96" cy="38" r="2" fill="#E8A020" opacity="0.5"/>

  <!-- Wordmark: ARCUMO -->
  <text
    x="118" y="72"
    font-family="'Cormorant Garamond', 'Georgia', serif"
    font-size="42"
    font-weight="600"
    letter-spacing="6"
    fill="#F0EDE8">ARCUMO</text>

  <!-- Subtitle: STUDIO -->
  <text
    x="120" y="92"
    font-family="'Inter', 'Helvetica Neue', sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="9"
    fill="#8A8A96">STUDIO</text>

</svg>
